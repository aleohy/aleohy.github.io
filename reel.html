    <!-- One <figure> per photo: the image, a caption, and the note that pops up on hover or tap.
         Photos live in assets/reel/. js/reel.js copies the frames so each row loops seamlessly, and drifts the rows. -->
    <div class="reel" aria-label="Photos from odd jobs and side hustles">
      <div class="reel-row">
        <div class="reel-track">
          <figure class="frame" tabindex="0">
            <div class="frame-photo"><img src="assets/reel/salalah.jpg" alt="Alexa mid-jump on a clifftop in Salalah, Oman"></div>
            <figcaption>Professional solo tourist</figcaption>
            <p class="frame-note"><span>I travelled a lot during consulting days, exploring multiple countries by myself, especially in the Middle East and Europe. This is Salalah.</span></p>
          </figure>
          <figure class="frame" tabindex="0">
            <div class="frame-photo"><img src="assets/reel/reporter.jpg" alt="Alexa in a pink dress, holding a microphone up high"></div>
            <figcaption>Freelance reporter</figcaption>
            <p class="frame-note"><span>I approached strangers and interviewed them behind the camera for a YouTube channel with 4M+ subscribers.</span></p>
          </figure>
          <figure class="frame" tabindex="0">
            <div class="frame-photo"><img src="assets/reel/venice.jpg" alt="Portrait of Alexa smiling in a pink coat and silk scarf, with the water behind her in Venice"></div>
            <figcaption>Professional solo tourist</figcaption>
            <p class="frame-note"><span>I rewarded myself for my 26th birthday with a lovely trip to Venice, a magical place I'd always wanted to visit since I was young. I met Filippo, an Italian who shared how photography made him happy and allowed him to feel again. He offers photography services in Venice, and he took pictures of me for free, along with a mini tour. Reach out to me for his contact details if you're ever visiting!</span></p>
          </figure>
          <figure class="frame" tabindex="0">
            <div class="frame-photo"><img src="assets/reel/photographer-prints.jpg" alt="Four guests holding small black-and-white prints of photos taken of them"></div>
            <figcaption>Photographer</figcaption>
            <p class="frame-note"><span>I blend in at events, take candid photos, and hand vintage-inspired prints straight to guests as keepsakes.</span></p>
          </figure>
          <figure class="frame" tabindex="0">
            <div class="frame-photo"><img src="assets/reel/model-portrait.jpg" alt="Studio portrait of Alexa against an orange backdrop"></div>
            <figcaption>Model</figcaption>
            <p class="frame-note"><span>One of 20 chosen from hundreds of ladies for a national modelling competition. I did commercial shoots from high school through college, plus a few runway walks.</span></p>
          </figure>
          <figure class="frame" tabindex="0">
            <div class="frame-photo"><img src="assets/reel/muay-thai.jpg" alt="Alexa in boxing gloves beside a young sparring partner at a Muay Thai gym"></div>
            <figcaption>Muay Thai beginner</figcaption>
            <p class="frame-note"><span>I did a Muay Thai bootcamp in Thailand: 4 hours of classes a day, morning runs, and getting outfought by an 11-year-old girl. I'm terrible at it, and that was the point. I wanted proof that I can learn and try anything.</span></p>
          </figure>
        </div>
      </div>

            <div class="frame-photo"><img src="assets/reel/petra.jpg?v=2" alt="Selfie of Alexa giving a thumbs up in front of the Treasury in Petra"></div>
            <figcaption>Self-organized “marathoner”</figcaption>
            <p class="frame-note"><span>I travelled a lot during consulting days, exploring multiple Middle Eastern countries by myself. I missed the Petra marathon, and am not fit enough to run it, so I ran my own little one.</span></p>
